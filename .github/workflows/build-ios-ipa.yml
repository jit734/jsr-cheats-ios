name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build Unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh build_fresh.sh
          ./build_fresh.sh
          ./build_esign_ready_ipa.sh build/JSRCHEATS-unsigned.ipa

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSRCHEATS-ESign-Ready-IPA
          path: build/JSRCHEATS-unsigned.ipa
          retention-days: 7
